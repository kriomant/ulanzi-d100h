[build-system]
requires = ["maturin>=1.13,<2"]
build-backend = "maturin"

[project]
name = "ulanzi-d100h"
version = "0.1.0"
description = "Python bindings for the Ulanzi D100H"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[project.urls]
Homepage = "https://github.com/kriomant/ulanzi-d100h"
Repository = "https://github.com/kriomant/ulanzi-d100h"

[tool.maturin]
bindings = "pyo3"
